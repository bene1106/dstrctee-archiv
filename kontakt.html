<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – DSTRCTEE Archiv</title>
  <meta name="description" content="Kontakt zu DSTRCTEE – Interesse hinterlassen oder direkt schreiben.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-top"></div>
  <noscript><p style="text-align:center;padding:16px;background:#f4abf3">Bitte JavaScript aktivieren – oder schreib direkt an info@dstrctee.com.</p></noscript>

  <main>
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Start</a> / <span>Kontakt</span></div>
      <section class="section section--tight">
        <div class="section__head">
          <span class="eyebrow">Kontakt</span>
          <h2>Schreib uns</h2>
          <p class="lead">Das Projekt ist pausiert. Du erreichst uns trotzdem – per E-Mail oder über das Interesse-Feld unten.</p>
        </div>

        <div class="info-cards" style="margin-bottom:36px">
          <div class="info-card"><h3>E-Mail</h3><a href="mailto:info@dstrctee.com">info@dstrctee.com</a></div>
          <div class="info-card"><h3>Instagram</h3><a href="https://www.instagram.com/dstrctee/" target="_blank" rel="noopener">@dstrctee</a></div>
          <div class="info-card"><h3>TikTok</h3><a href="https://www.tiktok.com/@dstrctee" target="_blank" rel="noopener">@dstrctee</a></div>
        </div>

        <div class="contact-form">
          <form class="interest__field interest-form" data-subject="Kontaktanfrage über die Archiv-Seite">
            <input type="hidden" name="_subject" value="Kontaktanfrage über die Archiv-Seite">
            <input type="email" name="email" placeholder="Deine E-Mail" required autocomplete="email" aria-label="E-Mail">
            <button type="submit">Absenden</button>
          </form>
          <div class="interest__hint">Wir melden uns per E-Mail zurück.</div>
          <div class="form-note" role="status"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-bottom"></div>
  <script src="assets/js/site.js"></script>
</body>
</html>
