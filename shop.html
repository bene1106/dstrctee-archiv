<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tees – DSTRCTEE Archiv</title>
  <meta name="description" content="Alle DSTRCTEE Tees im Überblick – ein Motiv für jeden Berliner Bezirk.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-top"></div>
  <noscript><p style="text-align:center;padding:16px;background:#f4abf3">Bitte JavaScript aktivieren, um die Produkte zu laden.</p></noscript>

  <main>
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Start</a> / <span>Tees</span></div>
      <section class="section section--tight">
        <div class="section__head">
          <span class="eyebrow">Archiv · 8 Motive</span>
          <h2>Tees</h2>
          <p class="lead">Ein Shirt für jeden Kiez, entworfen von lokalen Artists. Der Verkauf ist pausiert – Interesse kannst du auf jeder Produktseite hinterlassen.</p>
        </div>
        <div class="product-grid" id="produkt-grid">
          <p class="muted">Lade Produkte …</p>
        </div>
      </section>
    </div>
  </main>

  <div id="site-bottom"></div>
  <script src="assets/js/site.js"></script>
  <script>
    window.pageInit = async function () {
      const grid = document.getElementById("produkt-grid");
      try {
        const produkte = await loadProdukte();
        grid.innerHTML = produkte.map(productCard).join("");
      } catch (e) {
        grid.innerHTML = '<p class="form-note err">Produkte konnten nicht geladen werden.</p>';
        console.error(e);
      }
    };
  </script>
</body>
</html>
