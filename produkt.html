<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produkt – DSTRCTEE Archiv</title>
  <meta name="description" content="DSTRCTEE Tee – Detailansicht im Archiv.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-top"></div>
  <noscript><p style="text-align:center;padding:16px;background:#f4abf3">Bitte JavaScript aktivieren, um das Produkt anzuzeigen.</p></noscript>

  <main>
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Start</a> / <a href="shop.html">Tees</a> / <span id="crumb-title">…</span></div>
      <div id="produkt-detail">
        <p class="muted" style="padding:48px 0">Lade Produkt …</p>
      </div>
    </div>
  </main>

  <div id="site-bottom"></div>
  <script src="assets/js/site.js"></script>
  <script>
    window.pageInit = async function () {
      const root = document.getElementById("produkt-detail");
      const handle = getParam("handle");
      let produkte;
      try { produkte = await loadProdukte(); }
      catch (e) { root.innerHTML = '<p class="form-note err" style="padding:48px 0">Daten konnten nicht geladen werden.</p>'; return; }

      const p = produkte.find(x => x.handle === handle);
      if (!p) {
        root.innerHTML = '<div style="padding:64px 0"><h1 class="pdp__title">Nicht gefunden</h1><p class="muted">Dieses Produkt gibt es im Archiv nicht. <a href="shop.html" style="text-decoration:underline">Zur Übersicht</a></p></div>';
        return;
      }
      renderProductDetail(root, p);
    };
  </script>
</body>
</html>
