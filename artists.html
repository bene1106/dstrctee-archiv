<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsere Artists – DSTRCTEE Archiv</title>
  <meta name="description" content="Die Berliner Artists hinter den DSTRCTEE Tees – Kunst aus deinem Kiez.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-top"></div>
  <noscript><p style="text-align:center;padding:16px;background:#f4abf3">Bitte JavaScript aktivieren.</p></noscript>

  <main>
    <div class="wrap">
      <div class="crumb"><a href="index.html">Start</a> / Artists</div>
      <section class="section" style="padding-top:24px">
        <div class="section-head">
          <span class="eyebrow">berliner artists</span>
          <h1>Kunst aus deinem Kiez</h1>
          <p class="muted">Jedes Tee entstand zusammen mit lokalen Künstler:innen. Sie haben ihren Bezirk auf den Stoff gebracht – hier sind sie.</p>
        </div>
        <div class="media-band">
          <img src="DesignbilderWebseite/IMG_1311.jpg" alt="DSTRCTEE Artists / Models">
          <img src="DesignbilderWebseite/IMG_1340_cd5ad81c-8918-41fc-af89-bb2667c5e943.jpg" alt="Turmstraße-Motiv von Hannah">
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="artist-list" id="artist-list"><p class="muted">Lade Artists …</p></div>
        <p class="muted mt-32" style="font-size:.9rem">Hinweis: Bei einzelnen Tees lag im Shop-Export kein Künstlername vor – diese sind hier nicht aufgeführt.</p>
      </section>
    </div>
  </main>

  <div id="site-bottom"></div>
  <script src="assets/js/site.js"></script>
  <script>
    window.pageInit = async function () {
      const list = document.getElementById("artist-list");
      try {
        const produkte = await loadProdukte();
        const named = produkte.filter(p => p.artist && p.artist !== "DSTRCTEE");
        list.innerHTML = named.map(p => `
          <div class="a">
            <span class="k">${p.bezirk}</span>
            <p class="name">${p.artist}</p>
            <p class="muted" style="margin:.2em 0">Motiv: <a href="produkt.html?handle=${encodeURIComponent(p.handle)}">${p.titel}</a></p>
          </div>`).join("");
      } catch (e) {
        list.innerHTML = '<p class="form-note err">Konnte nicht geladen werden.</p>';
      }
    };
  </script>
</body>
</html>
